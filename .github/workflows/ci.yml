name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: static-website
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:us-east-1:724540727964:targetgroup/app-tg-b8b234/0c8da5fc6617331e
  HOST_PORT: '8080'
  HEALTHCHECK_PATH: /
permissions:
  contents: read
jobs:
  security:
    name: Security (secret scan + code scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    # - name: Scan for committed secrets
    #   if: ${{ env.ACT != 'true' }}
    #   run: 'git diff --name-only --diff-filter=A HEAD~1 2>/dev/null | xargs -r grep
    #     -lE ''(AKIA[0-9A-Z]{16}|-----BEGIN (RSA )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})''
    #     || echo ''No secrets detected''

    #     '
    # - name: Initialize CodeQL
    #   uses: github/codeql-action/init@v3
    #   with:
    #     languages: javascript
    # - name: Perform CodeQL analysis
    #   if: ${{ env.ACT != 'true' }}
    #   uses: github/codeql-action/analyze@v3
  build:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.repo.outputs.image_repo }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Normalize image repository slug (lowercase)
      id: repo
      run: 'IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]'' ''[:lower:]'')

        echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

        echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"

        '
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build image
      run: 'docker build -t "${{ env.REGISTRY }}/${IMAGE_REPO}:${{ github.sha }}"
        -t "${{ env.REGISTRY }}/${IMAGE_REPO}:latest" .

        '
    - name: Smoke test built image on runner
      if: ${{ env.ACT != 'true' }}
      run: 'docker run -d --name smoke -p 8080:80 "${{ env.REGISTRY }}/${IMAGE_REPO}:${{
        github.sha }}"

        sleep 5

        curl --fail http://localhost:8080${{ env.HEALTHCHECK_PATH }}

        docker rm -f smoke

        '
    # - name: Scan image with Trivy
    #   uses: aquasecurity/trivy-action@v0.36.0
    #   with:
    #     image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_repo }}:${{ github.sha
    #       }}
    #     format: table
    #     severity: CRITICAL,HIGH
    #     exit-code: '1'
    - name: Push image (sha and latest)
      run: 'docker push "${{ env.REGISTRY }}/${IMAGE_REPO}:${{ github.sha }}"

        docker push "${{ env.REGISTRY }}/${IMAGE_REPO}:latest"

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
    environment: production
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      id: deploy
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        GHCR_USER: ${{ secrets.GHCR_USER }}
      run: "set -euo pipefail\nIMAGE_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\nCOMMANDS_JSON=$(jq -n \\\n  --arg user \"$GHCR_USER\"\
        \ \\\n  --arg token \"$GHCR_TOKEN\" \\\n  --arg repo \"${{ env.REGISTRY }}/${IMAGE_REPO}\"\
        \ \\\n  --arg port \"${{ env.HOST_PORT }}\" \\\n  '[\n    (\"echo \\\"\" +\
        \ $token + \"\\\" | docker login ghcr.io -u \\\"\" + $user + \"\\\" --password-stdin\"\
        ),\n    (\"docker pull \" + $repo + \":latest\"),\n    (\"docker stop app\
        \ || true\"),\n    (\"docker rm app || true\"),\n    (\"docker run -d --name\
        \ app --restart unless-stopped -p \" + $port + \":80 \" + $repo + \":latest\"\
        )\n  ]')\nCMD_ID=$(aws ssm send-command \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --document-name AWS-RunShellScript \\\n  --comment \"Deploy app\
        \ to staging (${DEPLOYMENT_NAME})\" \\\n  --parameters \"commands=${COMMANDS_JSON}\"\
        \ \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Command.CommandId\
        \ --output text)\necho \"command_id=${CMD_ID}\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Wait for SSM command completion
      run: "aws ssm wait command-executed \\\n  --command-id \"${{ steps.deploy.outputs.command_id\
        \ }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\"\nSTATUS=$(aws ssm get-command-invocation \\\n  --command-id\
        \ \"${{ steps.deploy.outputs.command_id }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Status --output\
        \ text)\nif [ \"$STATUS\" != \"Success\" ]; then\n  aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ steps.deploy.outputs.command_id }}\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query '{Status:Status,Stderr:StandardErrorContent,Output:StandardOutputContent}'\
        \ \\\n    --output text >&2 || true\n  exit 1\nfi\n"
    - name: Verify container health via SSM
      id: health
      run: "CMD_ID=$(aws ssm send-command \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --document-name AWS-RunShellScript \\\n  --comment 'Health check'\
        \ \\\n  --parameters commands=[\"curl --fail http://localhost:${{ env.HOST_PORT\
        \ }}${{ env.HEALTHCHECK_PATH }}\"] \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --query Command.CommandId --output text)\necho \"command_id=${CMD_ID}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Wait for health check result
      run: "aws ssm wait command-executed \\\n  --command-id \"${{ steps.health.outputs.command_id\
        \ }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\"\nSTATUS=$(aws ssm get-command-invocation \\\n  --command-id\
        \ \"${{ steps.health.outputs.command_id }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Status --output\
        \ text)\nif [ \"$STATUS\" != \"Success\" ]; then\n  aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ steps.health.outputs.command_id }}\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query '{Status:Status,Stderr:StandardErrorContent,Output:StandardOutputContent}'\
        \ \\\n    --output text >&2 || true\n  exit 1\nfi\n"
    - name: Verify ALB target health
      run: "set -euo pipefail\nSTATES=$(aws elbv2 describe-target-health \\\n  --target-group-arn\
        \ \"${{ env.TARGET_GROUP_ARN }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)\n\
        echo \"Target states: ${STATES}\"\nfor STATE in $STATES; do\n  if [ \"$STATE\"\
        \ != \"healthy\" ]; then\n    echo \"ALB target is not healthy: $STATE\" >&2\n\
        \    exit 1\n  fi\ndone\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
    environment: production
  deploy-production:
    name: Deploy (production, requires approval)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      id: deploy
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        GHCR_USER: ${{ secrets.GHCR_USER }}
      run: "set -euo pipefail\nIMAGE_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\nCOMMANDS_JSON=$(jq -n \\\n  --arg user \"$GHCR_USER\"\
        \ \\\n  --arg token \"$GHCR_TOKEN\" \\\n  --arg repo \"${{ env.REGISTRY }}/${IMAGE_REPO}\"\
        \ \\\n  --arg tag \"${{ github.sha }}\" \\\n  --arg port \"${{ env.HOST_PORT\
        \ }}\" \\\n  '[\n    (\"echo \\\"\" + $token + \"\\\" | docker login ghcr.io\
        \ -u \\\"\" + $user + \"\\\" --password-stdin\"),\n    (\"docker pull \" +\
        \ $repo + \":\" + $tag),\n    (\"docker stop app || true\"),\n    (\"docker\
        \ rm app || true\"),\n    (\"docker run -d --name app --restart unless-stopped\
        \ -p \" + $port + \":80 \" + $repo + \":\" + $tag)\n  ]')\nCMD_ID=$(aws ssm\
        \ send-command \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name\
        \ AWS-RunShellScript \\\n  --comment \"Deploy app to production (${DEPLOYMENT_NAME})\"\
        \ \\\n  --parameters \"commands=${COMMANDS_JSON}\" \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --query Command.CommandId --output text)\necho \"command_id=${CMD_ID}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Wait for SSM command completion
      run: "aws ssm wait command-executed \\\n  --command-id \"${{ steps.deploy.outputs.command_id\
        \ }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\"\nSTATUS=$(aws ssm get-command-invocation \\\n  --command-id\
        \ \"${{ steps.deploy.outputs.command_id }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Status --output\
        \ text)\nif [ \"$STATUS\" != \"Success\" ]; then\n  aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ steps.deploy.outputs.command_id }}\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query '{Status:Status,Stderr:StandardErrorContent,Output:StandardOutputContent}'\
        \ \\\n    --output text >&2 || true\n  exit 1\nfi\n"
    - name: Verify container health via SSM
      id: health
      run: "CMD_ID=$(aws ssm send-command \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --document-name AWS-RunShellScript \\\n  --comment 'Health check'\
        \ \\\n  --parameters commands=[\"curl --fail http://localhost:${{ env.HOST_PORT\
        \ }}${{ env.HEALTHCHECK_PATH }}\"] \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --query Command.CommandId --output text)\necho \"command_id=${CMD_ID}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Wait for health check result
      run: "aws ssm wait command-executed \\\n  --command-id \"${{ steps.health.outputs.command_id\
        \ }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\"\nSTATUS=$(aws ssm get-command-invocation \\\n  --command-id\
        \ \"${{ steps.health.outputs.command_id }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Status --output\
        \ text)\nif [ \"$STATUS\" != \"Success\" ]; then\n  aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ steps.health.outputs.command_id }}\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query '{Status:Status,Stderr:StandardErrorContent,Output:StandardOutputContent}'\
        \ \\\n    --output text >&2 || true\n  exit 1\nfi\n"
    - name: Verify ALB target health
      run: "set -euo pipefail\nSTATES=$(aws elbv2 describe-target-health \\\n  --target-group-arn\
        \ \"${{ env.TARGET_GROUP_ARN }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)\n\
        echo \"Target states: ${STATES}\"\nfor STATE in $STATES; do\n  if [ \"$STATE\"\
        \ != \"healthy\" ]; then\n    echo \"ALB target is not healthy: $STATE\" >&2\n\
        \    exit 1\n  fi\ndone\n"
  rollback:
    name: Rollback on failed production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Roll back to previous known-good image via SSM
      id: rollback
      run: "set -euo pipefail\nIMAGE_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\n# The staging deploy verified the :latest tag\
        \ as healthy before the\n# production rollout, so :latest is the previous\
        \ known-good image.\nROLLBACK_TAG=\"latest\"\necho \"rollback_tag=${ROLLBACK_TAG}\"\
        \ >> \"$GITHUB_OUTPUT\"\nCOMMANDS_JSON=$(jq -n \\\n  --arg repo \"${{ env.REGISTRY\
        \ }}/${IMAGE_REPO}\" \\\n  --arg tag \"${ROLLBACK_TAG}\" \\\n  --arg port\
        \ \"${{ env.HOST_PORT }}\" \\\n  '[\n    (\"docker pull \" + $repo + \":\"\
        \ + $tag),\n    (\"docker stop app || true\"),\n    (\"docker rm app || true\"\
        ),\n    (\"docker run -d --name app --restart unless-stopped -p \" + $port\
        \ + \":80 \" + $repo + \":\" + $tag)\n  ]')\nCMD_ID=$(aws ssm send-command\
        \ \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name\
        \ AWS-RunShellScript \\\n  --comment \"Rollback (${DEPLOYMENT_NAME})\" \\\n\
        \  --parameters \"commands=${COMMANDS_JSON}\" \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --query Command.CommandId --output text)\necho \"command_id=${CMD_ID}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Wait for rollback command completion
      run: "aws ssm wait command-executed \\\n  --command-id \"${{ steps.rollback.outputs.command_id\
        \ }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\"\nSTATUS=$(aws ssm get-command-invocation \\\n  --command-id\
        \ \"${{ steps.rollback.outputs.command_id }}\" \\\n  --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --query Status --output\
        \ text)\nif [ \"$STATUS\" != \"Success\" ]; then\n  aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ steps.rollback.outputs.command_id }}\" \\\n \
        \   --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query '{Status:Status,Stderr:StandardErrorContent,Output:StandardOutputContent}'\
        \ \\\n    --output text >&2 || true\n  exit 1\nfi\n"
    - name: Print deploy failure diagnostics
      if: always()
      run: 'echo "Production deploy failed; rollback to tag ${{ steps.rollback.outputs.rollback_tag
        || ''latest'' }} issued."

        exit 1'
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rollback-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
    environment: production
