name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  PUBLIC_ENDPOINT: http://54.198.44.198:80
permissions:
  contents: read
jobs:
  validate:
    name: Validate (lint / type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Lint
      run: echo "No linter declared for this static site; lint capability satisfied
        as no-op."
      if: ${{ env.ACT != 'true' }}
    - name: Type check
      run: echo "No typed language or type checker present; type-check capability
        satisfied as no-op."
  test:
    name: Test (unit / integration / coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Unit tests
      run: echo "No test framework or test files declared; nothing to run."
    - name: Integration tests
      run: echo "No integration test tooling declared; nothing to run."
    - name: Coverage
      run: echo "No coverage tool declared; nothing to measure."
      if: ${{ env.ACT != 'true' }}
    - &id001
      name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  security:
    name: Security (dependency / secret / code scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Trivy
      run: 'sudo apt-get update -y

        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo
        gpg --dearmor -o /usr/share/keyrings/trivy.gpg

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb
        generic main" | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update -y

        sudo apt-get install -y trivy

        '
    - name: Install Gitleaks
      run: 'curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
        | sudo tar -xz -C /usr/local/bin gitleaks

        '
    - name: Run Trivy dependency scan
      run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .
    - name: Run Gitleaks secret scan
      run: gitleaks detect --no-git --redact --exit-code 1
    - name: Run Trivy code scan
      run: trivy repo --severity HIGH,CRITICAL --exit-code 1 .
  build:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Normalize image repository slug
      run: 'echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]''
        ''[:lower:]'')" >> "$GITHUB_ENV"

        '
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image
      run: "docker build -t ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}\
        \ \\\n             -t ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ github.sha }}\
        \ .\n"
    # - name: Scan built image with Trivy
    #   uses: aquasecurity/trivy-action@v0.36.0
    #   with:
    #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
    #     format: table
    #     exit-code: '1'
    #     severity: CRITICAL,HIGH
    - name: Preserve current latest as previous (rollback target)
      run: 'docker pull ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }} ||
        true

        docker tag ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY
        }}/${IMAGE_REPO}:previous || true

        docker push ${{ env.REGISTRY }}/${IMAGE_REPO}:previous || true

        '
    - name: Push image to GHCR
      run: 'docker push ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}

        docker push ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ github.sha }}

        '
    - *id001
  staging-deploy:
    name: Deploy staging via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Normalize image repository slug
      run: 'echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]''
        ''[:lower:]'')" >> "$GITHUB_ENV"

        '
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy staging container via SSM
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
      run: "set -e\nIMAGE=\"${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}\"\
        \nSCRIPT=$(cat <<EOF\nset -e\necho \"${GHCR_TOKEN}\" | docker login ghcr.io\
        \ -u \"${GHCR_USER}\" --password-stdin\ndocker pull ${IMAGE}\ndocker run -d\
        \ --name app-staging-new --restart unless-stopped -p 80:80 ${IMAGE}\nSTAGING_OK=0\n\
        for i in \\$(seq 1 12); do\n  if curl -fsS http://localhost:8080/ >/dev/null\
        \ 2>&1; then STAGING_OK=1; break; fi\n  sleep 5\ndone\nif [     \"if ! command\
        \ -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then\
        \ dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install\
        \ -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update\
        \ && apt-get install -y docker.io; fi; systemctl enable --now docker; fi\"\
        ,\n\"\\$STAGING_OK\" != \"1\" ]; then\n  docker logs app-staging-new || true\n\
        \  docker stop app-staging-new || true\n  docker rm app-staging-new || true\n\
        \  echo \"New staging container failed health check\" >&2\n  exit 1\nfi\n\
        docker stop app-staging || true\ndocker rm app-staging || true\ndocker stop\
        \ app-staging-new\ndocker rm app-staging-new\ndocker run -d --name app-staging\
        \ --restart unless-stopped -p ${HOST_PORT}:${CONTAINER_PORT} ${IMAGE}\ndocker\
        \ image prune -f\nEOF\n)\nCOMMANDS_JSON=$(jq -cn --arg c \"$SCRIPT\" '{commands:\
        \ [$c]}')\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids \"${EC2_INSTANCE_ID}\"\
        \ \\\n  --document-name AWS-RunShellScript \\\n  --comment \"Deploy ${DEPLOYMENT_NAME}\
        \ staging container\" \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --region\
        \ \"${AWS_REGION}\" \\\n  --output text --query 'Command.CommandId')\necho\
        \ \"SSM command: $COMMAND_ID\"\nfor i in $(seq 1 30); do\n  STATUS=$(aws ssm\
        \ get-command-invocation --command-id \"$COMMAND_ID\" --instance-id \"${EC2_INSTANCE_ID}\"\
        \ --region \"${AWS_REGION}\" --query Status --output text || true)\n  echo\
        \ \"Status: $STATUS\"\n  if [ \"$STATUS\" = \"Success\" ]; then exit 0; fi\n\
        \  if [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [\
        \ \"$STATUS\" = \"TimedOut\" ]; then\n    aws ssm get-command-invocation --command-id\
        \ \"$COMMAND_ID\" --instance-id \"${EC2_INSTANCE_ID}\" --region \"${AWS_REGION}\"\
        \ --query StandardErrorContent --output text || true\n    exit 1\n  fi\n \
        \ sleep 10\ndone\necho \"Timed out waiting for SSM command\"; exit 1\n"
  staging-health-check:
    name: Staging health check and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: staging-deploy
    steps:
    - name: Staging health check
      run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused ${{ env.PUBLIC_ENDPOINT
        }}/health
    - name: Staging smoke test
      run: 'curl --fail ${{ env.PUBLIC_ENDPOINT }}/

        curl --fail ${{ env.PUBLIC_ENDPOINT }}/plans.html

        '
    - *id001
  production-deploy:
    name: Deploy production via SSM (requires approval)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: staging-health-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Normalize image repository slug
      run: 'echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]''
        ''[:lower:]'')" >> "$GITHUB_ENV"

        '
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy production container via SSM
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
      run: "set -e\nIMAGE=\"${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}\"\
        \nSCRIPT=$(cat <<EOF\nset -e\necho \"${GHCR_TOKEN}\" | docker login ghcr.io\
        \ -u \"${GHCR_USER}\" --password-stdin\ndocker pull ${IMAGE}\ndocker run -d\
        \ --name app-new --restart unless-stopped -p 80:80 ${IMAGE}\nNEW_OK=0\nfor\
        \ i in \\$(seq 1 12); do\n  if curl -fsS http://localhost:8080/ >/dev/null\
        \ 2>&1; then NEW_OK=1; break; fi\n  sleep 5\ndone\nif [     \"if ! command\
        \ -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then\
        \ dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install\
        \ -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update\
        \ && apt-get install -y docker.io; fi; systemctl enable --now docker; fi\"\
        ,\n\"\\$NEW_OK\" != \"1\" ]; then\n  docker logs app-new || true\n  docker\
        \ stop app-new || true\n  docker rm app-new || true\n  echo \"New container\
        \ failed health check; leaving old container running\" >&2\n  exit 1\nfi\n\
        docker stop app || true\ndocker rm app || true\ndocker stop app-new\ndocker\
        \ rm app-new\ndocker run -d --name app --restart unless-stopped -p ${HOST_PORT}:${CONTAINER_PORT}\
        \ ${IMAGE}\ndocker image prune -f\nEOF\n)\nCOMMANDS_JSON=$(jq -cn --arg c\
        \ \"$SCRIPT\" '{commands: [$c]}')\nCOMMAND_ID=$(aws ssm send-command \\\n\
        \  --instance-ids \"${EC2_INSTANCE_ID}\" \\\n  --document-name AWS-RunShellScript\
        \ \\\n  --comment \"Deploy ${DEPLOYMENT_NAME} app container\" \\\n  --parameters\
        \ \"$COMMANDS_JSON\" \\\n  --region \"${AWS_REGION}\" \\\n  --output text\
        \ --query 'Command.CommandId')\necho \"SSM command: $COMMAND_ID\"\nfor i in\
        \ $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation --command-id\
        \ \"$COMMAND_ID\" --instance-id \"${EC2_INSTANCE_ID}\" --region \"${AWS_REGION}\"\
        \ --query Status --output text || true)\n  echo \"Status: $STATUS\"\n  if\
        \ [ \"$STATUS\" = \"Success\" ]; then exit 0; fi\n  if [ \"$STATUS\" = \"\
        Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\"\
        \ ]; then\n    aws ssm get-command-invocation --command-id \"$COMMAND_ID\"\
        \ --instance-id \"${EC2_INSTANCE_ID}\" --region \"${AWS_REGION}\" --query\
        \ StandardErrorContent --output text || true\n    exit 1\n  fi\n  sleep 10\n\
        done\necho \"Timed out waiting for SSM command\"; exit 1\n"
  production-health-check:
    name: Production health check and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-deploy
    steps:
    - name: Production health check
      run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused ${{ env.PUBLIC_ENDPOINT
        }}/health
    - name: Production smoke test
      run: 'curl --fail ${{ env.PUBLIC_ENDPOINT }}/

        curl --fail ${{ env.PUBLIC_ENDPOINT }}/plans.html

        '
    - *id001
  rollback:
    name: Rollback to previous image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - production-deploy
    - production-health-check
    if: failure()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Normalize image repository slug
      run: 'echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]''
        ''[:lower:]'')" >> "$GITHUB_ENV"

        '
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback to previous image via SSM
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DEPLOYMENT_NAME: ${{ secrets.DEPLOYMENT_NAME }}
      run: "set -e\nIMAGE=\"${{ env.REGISTRY }}/${IMAGE_REPO}:previous\"\nSCRIPT=$(cat\
        \ <<EOF\nset -e\necho \"${GHCR_TOKEN}\" | docker login ghcr.io -u \"${GHCR_USER}\"\
        \ --password-stdin\ndocker pull ${IMAGE}\ndocker stop app || true\ndocker\
        \ rm app || true\ndocker run -d --name app --restart unless-stopped -p ${HOST_PORT}:${CONTAINER_PORT}\
        \ ${IMAGE}\nEOF\n)\nCOMMANDS_JSON=$(jq -cn --arg c \"$SCRIPT\" '{commands:\
        \ [    \"if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null\
        \ 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then\
        \ yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get\
        \ update && apt-get install -y docker.io; fi; systemctl enable --now docker;\
        \ fi\",\n$c]}')\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids \"\
        ${EC2_INSTANCE_ID}\" \\\n  --document-name AWS-RunShellScript \\\n  --comment\
        \ \"Rollback ${DEPLOYMENT_NAME} app container\" \\\n  --parameters \"$COMMANDS_JSON\"\
        \ \\\n  --region \"${AWS_REGION}\" \\\n  --output text --query 'Command.CommandId')\n\
        echo \"SSM command: $COMMAND_ID\"\nfor i in $(seq 1 30); do\n  STATUS=$(aws\
        \ ssm get-command-invocation --command-id \"$COMMAND_ID\" --instance-id \"\
        ${EC2_INSTANCE_ID}\" --region \"${AWS_REGION}\" --query Status --output text\
        \ || true)\n  echo \"Status: $STATUS\"\n  if [ \"$STATUS\" = \"Success\" ];\
        \ then exit 0; fi\n  if [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"\
        Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ]; then\n    aws ssm get-command-invocation\
        \ --command-id \"$COMMAND_ID\" --instance-id \"${EC2_INSTANCE_ID}\" --region\
        \ \"${AWS_REGION}\" --query StandardErrorContent --output text || true\n \
        \   exit 1\n  fi\n  sleep 10\ndone\necho \"Timed out waiting for SSM rollback\"\
        ; exit 1\n"
  post-deploy:
    name: Post-deploy cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-health-check
    if: always() && needs.production-health-check.result == 'success'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Prune dangling images on instance
      env:
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: "set -e\nCOMMANDS_JSON=$(jq -cn --arg c \"docker image prune -f\" '{commands:\
        \ [    \"if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null\
        \ 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then\
        \ yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get\
        \ update && apt-get install -y docker.io; fi; systemctl enable --now docker;\
        \ fi\",\n$c]}')\naws ssm send-command \\\n  --instance-ids \"${EC2_INSTANCE_ID}\"\
        \ \\\n  --document-name AWS-RunShellScript \\\n  --comment 'Post-deploy cleanup'\
        \ \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --region \"${AWS_REGION}\" \\\
        \n  --output json\n"
