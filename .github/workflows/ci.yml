name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  ACCESS_URL: http://54.198.44.198:80
  HEALTHCHECK_PATH: /
  PYTHON_VERSION: '3.12'
permissions:
  contents: read
jobs:
  validate:
    name: Validate & Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Secret scan (gitleaks)
      if: ${{ env.ACT != 'true' }}
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Code scan (Trivy filesystem)
      if: ${{ env.ACT != 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        severity: CRITICAL,HIGH
        exit-code: '1'
    - name: Dependency scan (Trivy repo mode)
      if: ${{ env.ACT != 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: repo
        scan-ref: .
        severity: CRITICAL,HIGH
        exit-code: '1'
  build:
    name: Build, Scan & Publish Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute lowercase image repo
      run: |
        echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Build Docker image
      run: |
        docker build -t "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" \
                     -t "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}" .
    - name: Smoke test image
      run: |
        docker run -d --name smoke -p 8080:80 "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
        SMOKE_OK=0
        for i in $(seq 1 15); do
          if curl --fail http://localhost:8080${{ env.HEALTHCHECK_PATH }}; then SMOKE_OK=1; break; fi
          sleep 2
        done
        docker rm -f smoke
        if [ "$SMOKE_OK" != "1" ]; then
          echo "Smoke test failed: container did not become healthy"
          exit 1
        fi
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
    - name: Tag previous release for rollback
      run: |
        if docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" 2>/dev/null; then
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous"
        else
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}" "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous"
        fi
    - name: Push image to GHCR
      run: |
        docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
        docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}"
        docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous"
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: image-metadata
        path: Dockerfile
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Compute lowercase image repo
      run: |
        echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Deploy container to EC2 via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi",
            "systemctl enable --now docker || service docker start",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "docker info",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "HEALTH_OK=0",
            "for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new curl -sf http://localhost:" + ($container_port | @sh) + "/ 2>/dev/null; then HEALTH_OK=1; break; fi; if docker exec " + ($app_name | @sh) + "-new wget -qO- http://localhost:" + ($container_port | @sh) + "/ 2>/dev/null; then HEALTH_OK=1; break; fi; sleep 2; done",
            "if [ \"$HEALTH_OK\" != \"1\" ]; then echo \"New container failed health check\"; docker logs " + ($app_name | @sh) + "-new 2>&1 || true; exit 1; fi",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name | @sh) + "-new",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null",
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query Status --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" = "Success" ]; then exit 0; fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          sleep 10
        done
        echo "SSM command timed out"
        exit 1
  health-check:
    name: Staging Health Check & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Health check
      run: |
        for i in $(seq 1 30); do
          if curl --fail "${{ env.ACCESS_URL }}${{ env.HEALTHCHECK_PATH }}"; then exit 0; fi
          sleep 5
        done
        echo 'Health check failed'
        exit 1
    - name: Smoke test
      run: |
        curl --fail --silent "${{ env.ACCESS_URL }}${{ env.HEALTHCHECK_PATH }}" | grep -q 'OK'
  post-deploy:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: health-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy verification via SSM
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi",
            "systemctl enable --now docker || service docker start",
            "docker ps --filter name=" + ($app_name | @sh) + " --filter status=running",
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-post.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-post.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query Status --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" = "Success" ]; then exit 0; fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          sleep 10
        done
        exit 1
  rollback:
    name: Rollback to Previous Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Compute lowercase image repo
      run: |
        echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Roll back to previous image via SSM
      shell: bash
      run: |-
        set -euo pipefail
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi",
            "systemctl enable --now docker || service docker start",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null",
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query Status --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" = "Success" ]; then exit 0; fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          sleep 10
        done
        exit 1