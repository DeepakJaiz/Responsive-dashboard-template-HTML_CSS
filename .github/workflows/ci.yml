name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  CONTAINER_NAME: app
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Trivy
      run: 'curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
        | sh -s -- -b /usr/local/bin

        trivy --version

        '
    - name: Run Trivy filesystem scan
      if: ${{ env.ACT != 'true' }}
      run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .
    - name: Install gitleaks
      run: 'curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
        | tar -xz -C /usr/local/bin gitleaks

        gitleaks version

        '
    - name: Run gitleaks secret scan
      if: ${{ env.ACT != 'true' }}
      run: gitleaks detect --no-git --redact --exit-code 1
    - name: Initialize CodeQL
      if: ${{ env.ACT != 'true' }}
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
    - name: Perform CodeQL analysis
      if: ${{ env.ACT != 'true' }}
      uses: github/codeql-action/analyze@v3
  build:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Normalize image repository name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test container locally
      run: 'docker run -d --name smoke -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{
        env.IMAGE_TAG }}

        sleep 5

        curl --fail http://localhost:8080/

        docker rm -f smoke

        '
    - name: Scan built image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Save image artifact
      run: docker save ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        -o /tmp/image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Normalize image repository name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    - name: Load image
      run: docker load -i /tmp/image.tar
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      run: 'docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG
        }}

        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest

        '
    - name: Upload publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  deploy-staging:
    name: Deploy Staging (EC2 via SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Normalize image repository name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container to EC2 via SSM
      run: "set -euo pipefail\nIMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest\"\
        \nPREVIOUS_IMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous\"\n\
        COMMANDS_JSON=$(jq -n \\\n  --arg img \"$IMAGE\" \\\n  --arg prev \"$PREVIOUS_IMAGE\" \\\n\
        \  --arg user \"${{ secrets.GHCR_USER }}\" \\\n  --arg token \"${{ secrets.GHCR_TOKEN\
        \ }}\" \\\n  --arg host_port \"${{ env.HOST_PORT }}\" \\\n  --arg container_port\
        \ \"${{ env.CONTAINER_PORT }}\" \\\n  '[    \"if ! command -v docker >/dev/null\
        \ 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker;\
        \ elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command\
        \ -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io;\
        \ fi; systemctl enable --now docker; fi\",\n\"set -e\",\n    \"echo \\\"\\\
        ($token)\\\" | docker login ghcr.io -u \\\"\\($user)\\\" --password-stdin\"\
        ,\n    \"if docker inspect app >/dev/null 2>&1; then PREV_ID=$(docker inspect\
        \ --format \\\"{{.Image}}\\\" app); docker tag $PREV_ID \\($prev) && docker\
        \ push \\($prev); fi\",\n    \"docker pull \\($img)\",\n    \"docker run -d\
        \ --name app-new --restart unless-stopped -p \\($host_port):\\($container_port)\
        \ \\($img)\",\n    \"curl --fail http://localhost:\\($host_port)/\",\n   \
        \ \"docker stop app || true\",\n    \"docker rm app || true\",\n    \"docker\
        \ rename app-new app\",\n    \"docker image prune -f\"] | map(@sh) | join(\"\
        \ \")')\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --comment \"Deploy app container (staging) deployment=${{ secrets.DEPLOYMENT_NAME\
        \ }}\" \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --query Command.CommandId\
        \ --output text)\nfor i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation\
        \ --command-id \"$COMMAND_ID\" \\\n    --instance-id \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" --region \"${{ env.AWS_REGION }}\" --query Status --output text)\n\
        \  echo \"SSM status: $STATUS\"\n  [ \"$STATUS\" = \"Success\" ] && exit 0\n\
        \  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"\
        $STATUS\" = \"TimedOut\" ] && break\n  sleep 5\ndone\naws ssm get-command-invocation\
        \ --command-id \"$COMMAND_ID\" \\\n  --instance-id \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" --region \"${{ env.AWS_REGION }}\" \\\n  --query '{Status:Status,Stderr:StandardErrorContent,Stdout:StandardOutputContent}'\
        \ || true\nexit 1\n"
      if: ${{ env.ACT != 'true' }}
    - name: Health check via SSM
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Staging health\
        \ check\" \\\n  --parameters commands='curl --fail http://localhost:${{ env.HOST_PORT\
        \ }}/' \\\n  --query Command.CommandId --output text)\nfor i in $(seq 1 20);\
        \ do\n  STATUS=$(aws ssm get-command-invocation --command-id \"$COMMAND_ID\"\
        \ \\\n    --instance-id \"${{ secrets.EC2_INSTANCE_ID }}\" --region \"${{\
        \ env.AWS_REGION }}\" --query Status --output text)\n  [ \"$STATUS\" = \"\
        Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\"\
        \ ] || [ \"$STATUS\" = \"TimedOut\" ] && break\n  sleep 5\ndone\nexit 1\n"
    - name: Smoke test via SSM
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Staging smoke\
        \ test\" \\\n  --parameters commands='curl --fail http://localhost:${{ env.HOST_PORT\
        \ }}/ && curl --fail http://localhost:${{ env.HOST_PORT }}/index.html' \\\n\
        \  --query Command.CommandId --output text)\nfor i in $(seq 1 20); do\n  STATUS=$(aws\
        \ ssm get-command-invocation --command-id \"$COMMAND_ID\" \\\n    --instance-id\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION }}\" --query\
        \ Status --output text)\n  [ \"$STATUS\" = \"Success\" ] && exit 0\n  [ \"\
        $STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\"\
        \ = \"TimedOut\" ] && break\n  sleep 5\ndone\nexit 1\n"
    - name: Upload staging deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  deploy-production:
    name: Deploy Production (EC2 via SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Normalize image repository name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container to EC2 via SSM
      run: "set -euo pipefail\nIMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest\"\
        \nPREVIOUS_IMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous\"\n\
        COMMANDS_JSON=$(jq -n \\\n  --arg img \"$IMAGE\" \\\n  --arg prev \"$PREVIOUS_IMAGE\" \\\n\
        \  --arg user \"${{ secrets.GHCR_USER }}\" \\\n  --arg token \"${{ secrets.GHCR_TOKEN\
        \ }}\" \\\n  --arg host_port \"${{ env.HOST_PORT }}\" \\\n  --arg container_port\
        \ \"${{ env.CONTAINER_PORT }}\" \\\n  '[    \"if ! command -v docker >/dev/null\
        \ 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker;\
        \ elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command\
        \ -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io;\
        \ fi; systemctl enable --now docker; fi\",\n\"set -e\",\n    \"echo \\\"\\\
        ($token)\\\" | docker login ghcr.io -u \\\"\\($user)\\\" --password-stdin\"\
        ,\n    \"if docker inspect app >/dev/null 2>&1; then PREV_ID=$(docker inspect\
        \ --format \\\"{{.Image}}\\\" app); docker tag $PREV_ID \\($prev) && docker\
        \ push \\($prev); fi\",\n    \"docker pull \\($img)\",\n    \"docker run -d\
        \ --name app-new --restart unless-stopped -p \\($host_port):\\($container_port)\
        \ \\($img)\",\n    \"curl --fail http://localhost:\\($host_port)/\",\n   \
        \ \"docker stop app || true\",\n    \"docker rm app || true\",\n    \"docker\
        \ rename app-new app\",\n    \"docker image prune -f\"] | map(@sh) | join(\"\
        \ \")')\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --comment \"Deploy app container (production) deployment=${{ secrets.DEPLOYMENT_NAME\
        \ }}\" \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --query Command.CommandId\
        \ --output text)\nfor i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation\
        \ --command-id \"$COMMAND_ID\" \\\n    --instance-id \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" --region \"${{ env.AWS_REGION }}\" --query Status --output text)\n\
        \  echo \"SSM status: $STATUS\"\n  [ \"$STATUS\" = \"Success\" ] && exit 0\n\
        \  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"\
        $STATUS\" = \"TimedOut\" ] && break\n  sleep 5\ndone\naws ssm get-command-invocation\
        \ --command-id \"$COMMAND_ID\" \\\n  --instance-id \"${{ secrets.EC2_INSTANCE_ID\
        \ }}\" --region \"${{ env.AWS_REGION }}\" \\\n  --query '{Status:Status,Stderr:StandardErrorContent,Stdout:StandardOutputContent}'\
        \ || true\nexit 1\n"
      if: ${{ env.ACT != 'true' }}
    - name: Health check via SSM
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Production\
        \ health check\" \\\n  --parameters commands='curl --fail http://localhost:${{\
        \ env.HOST_PORT }}/' \\\n  --query Command.CommandId --output text)\nfor i\
        \ in $(seq 1 20); do\n  STATUS=$(aws ssm get-command-invocation --command-id\
        \ \"$COMMAND_ID\" \\\n    --instance-id \"${{ secrets.EC2_INSTANCE_ID }}\"\
        \ --region \"${{ env.AWS_REGION }}\" --query Status --output text)\n  [ \"$STATUS\"\
        \ = \"Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\"\
        \ = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ] && break\n  sleep 5\n\
        done\nexit 1\n"
    - name: Smoke test via SSM
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Production\
        \ smoke test\" \\\n  --parameters commands='curl --fail http://localhost:${{\
        \ env.HOST_PORT }}/ && curl --fail http://localhost:${{ env.HOST_PORT }}/index.html'\
        \ \\\n  --query Command.CommandId --output text)\nfor i in $(seq 1 20); do\n\
        \  STATUS=$(aws ssm get-command-invocation --command-id \"$COMMAND_ID\" \\\
        \n    --instance-id \"${{ secrets.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION\
        \ }}\" --query Status --output text)\n  [ \"$STATUS\" = \"Success\" ] && exit\
        \ 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] ||\
        \ [ \"$STATUS\" = \"TimedOut\" ] && break\n  sleep 5\ndone\nexit 1\n"
    - name: Upload production deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-production-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  rollback:
    name: Rollback to Previous Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && failure()
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Normalize image repository name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback to previous image via SSM
      run: "set -euo pipefail\nIMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous\"\
        \nCOMMANDS_JSON=$(jq -n \\\n  --arg img \"$IMAGE\" \\\n  --arg user \"${{\
        \ secrets.GHCR_USER }}\" \\\n  --arg token \"${{ secrets.GHCR_TOKEN }}\" \\\
        \n  --arg host_port \"${{ env.HOST_PORT }}\" \\\n  --arg container_port \"\
        ${{ env.CONTAINER_PORT }}\" \\\n  '[    \"if ! command -v docker >/dev/null\
        \ 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker;\
        \ elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command\
        \ -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io;\
        \ fi; systemctl enable --now docker; fi\",\n\"set -e\",\n    \"echo \\\"\\\
        ($token)\\\" | docker login ghcr.io -u \\\"\\($user)\\\" --password-stdin\"\
        ,\n    \"docker pull \\($img)\",\n    \"docker stop app || true\",\n    \"\
        docker rm app || true\",\n    \"docker run -d --name app --restart unless-stopped\
        \ -p \\($host_port):\\($container_port) \\($img)\",\n    \"curl --fail http://localhost:\\\
        ($host_port)/\"] | map(@sh) | join(\" \")')\nCOMMAND_ID=$(aws ssm send-command\
        \ \\\n  --instance-ids \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"\
        ${{ env.AWS_REGION }}\" \\\n  --document-name \"AWS-RunShellScript\" \\\n\
        \  --comment \"Rollback app container\" \\\n  --parameters \"$COMMANDS_JSON\"\
        \ \\\n  --query Command.CommandId --output text)\nfor i in $(seq 1 30); do\n\
        \  STATUS=$(aws ssm get-command-invocation --command-id \"$COMMAND_ID\" \\\
        \n    --instance-id \"${{ secrets.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION\
        \ }}\" --query Status --output text)\n  [ \"$STATUS\" = \"Success\" ] && exit\
        \ 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] ||\
        \ [ \"$STATUS\" = \"TimedOut\" ] && break\n  sleep 5\ndone\nexit 1\n"
  post-deploy:
    name: Post Deploy Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Prune dangling images on host
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Post-deploy\
        \ cleanup\" \\\n  --parameters commands='docker image prune -f' \\\n  --query\
        \ Command.CommandId --output text)\nfor i in $(seq 1 20); do\n  STATUS=$(aws\
        \ ssm get-command-invocation --command-id \"$COMMAND_ID\" \\\n    --instance-id\
        \ \"${{ secrets.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION }}\" --query\
        \ Status --output text)\n  [ \"$STATUS\" = \"Success\" ] && exit 0\n  [ \"\
        $STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\"\
        \ = \"TimedOut\" ] && break\n  sleep 5\ndone\nexit 1\n"