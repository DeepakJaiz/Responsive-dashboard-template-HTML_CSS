name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0834eea338b0a9db9
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  PYTHON_VERSION: '3.12'
jobs:
  validate:
    name: Validate (lint / type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Detect lintable sources
      id: detect
      run: "if find . -maxdepth 3 -name '*.py' -not -path './.git/*' | grep -q .;\
        \ then\n  echo \"python=true\" >> \"$GITHUB_OUTPUT\"\nfi\nif find . -maxdepth\
        \ 3 -name '*.js' -o -maxdepth 3 -name '*.ts' -not -path './.git/*' | grep\
        \ -q .; then\n  echo \"js=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      if: ${{ env.ACT != 'true' }}
    - name: Lint / type-check (Python)
      if: ${{ steps.detect.outputs.python == 'true' && env.ACT != 'true' }}
      run: 'pip install --break-system-packages ruff mypy

        ruff check .

        mypy . || true

        '
    - name: Lint (JS/TS)
      if: ${{ steps.detect.outputs.js == 'true' && env.ACT != 'true' }}
      run: npx --yes eslint . || true
    - name: No lintable sources found
      if: ${{ steps.detect.outputs.python != 'true' && steps.detect.outputs.js !=
        'true' }}
      run: echo "No lintable/type-checkable sources detected; skipping."
  test:
    name: Test (unit / integration / coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Detect test tooling
      id: detect
      run: 'if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "python=true"
        >> "$GITHUB_OUTPUT"; fi

        if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi

        '
    - name: Run Python tests with coverage
      if: ${{ steps.detect.outputs.python == 'true' && env.ACT != 'true' }}
      run: 'pip install --break-system-packages pytest pytest-cov

        pytest --cov=. --cov-report=xml || true

        '
    - name: Run Node tests
      if: ${{ steps.detect.outputs.node == 'true' && env.ACT != 'true' }}
      run: 'npm ci || npm install

        npm test || true

        '
    - name: No test tooling found
      if: ${{ steps.detect.outputs.python != 'true' && steps.detect.outputs.node !=
        'true' }}
      run: echo "No test framework detected; skipping tests."
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: 'coverage.xml

          .coverage

          '
        if-no-files-found: ignore
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-job-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  security:
    name: Security (dependency / secret / code scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Dependency scan (Trivy filesystem)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Code scan (Semgrep)
      if: ${{ env.ACT != 'true' }}
      run: 'pip install --break-system-packages semgrep

        semgrep scan --config auto --error || true

        '
  build:
    name: Build & scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Normalize image repository slug
      run: 'IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]'' ''[:lower:]'')

        echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"

        '
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      run: docker build -t "${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        -t "${{ env.REGISTRY }}/${IMAGE_REPO}:latest" .
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Save image artifact
      run: docker save "${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}" -o
        /tmp/app-image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-image
        path: /tmp/app-image.tar
        retention-days: 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-job-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Normalize image repository slug
      run: 'IMAGE_REPO=$(echo "${{ github.repository }}" | tr ''[:upper:]'' ''[:lower:]'')

        echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"

        '
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: app-image
        path: /tmp
    - name: Load image
      run: docker load -i /tmp/app-image.tar
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      run: 'docker push "${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        docker push "${{ env.REGISTRY }}/${IMAGE_REPO}:latest"

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-job-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  deploy-staging:
    name: Deploy (staging) via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      id: deploy
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: "set -euo pipefail\nLOWER_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\nIMAGE=\"${{ env.REGISTRY }}/${LOWER_REPO}:${{\
        \ env.IMAGE_TAG }}\"\nSCRIPT=$(cat <<'EOF'\nset -e\nif ! command -v docker\
        \ >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install\
        \ -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker;\
        \ elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get\
        \ install -y docker.io; fi; systemctl enable --now docker; fi\necho \"$GHCR_TOKEN\"\
        \ | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin\ndocker pull $IMAGE\ndocker\
        \ rm -f app || true\ndocker run -d --name app --restart unless-stopped -p\
        \ 80:80 $IMAGE\ndocker ps --filter name=app\nEOF\n)\nCOMMANDS_JSON=$(jq -n\
        \ --arg c \"$SCRIPT\" '[\"set -e\",$c]')\nCOMMAND_ID=$(aws ssm send-command\
        \ \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name\
        \ \"AWS-RunShellScript\" \\\n  --comment \"Deploy app container (staging)\"\
        \ \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --output json | jq -r '.Command.CommandId')\necho \"COMMAND_ID=${COMMAND_ID}\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Wait for SSM command success
      run: "set -euo pipefail\nfor i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ env.COMMAND_ID }}\" \\\n    --instance-id \"\
        ${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION }}\" \\\
        \n    --query Status --output text)\n  echo \"Status: $STATUS\"\n  [ \"$STATUS\"\
        \ = \"Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\"\
        \ = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ] && exit 1\n  sleep 10\n\
        done\nexit 1\n"
    - name: Health check (in-instance)
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --parameters commands='[\"curl --fail http://localhost:80/\"]' \\\n\
        \  --region \"${{ env.AWS_REGION }}\" \\\n  --output json | jq -r '.Command.CommandId')\n\
        for i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation \\\n \
        \    --command-id \"$COMMAND_ID\" \\\n    --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n    --region \"${{ env.AWS_REGION }}\" \\\n    --query Status --output\
        \ text)\n  echo \"Status: $STATUS\"\n  [ \"$STATUS\" = \"Success\" ] && exit\
        \ 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] ||\
        \ [ \"$STATUS\" = \"TimedOut\" ] && exit 1\n  sleep 10\ndone\nexit 1\n"
    - name: Smoke test root endpoint
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --parameters commands='[\"curl --fail http://localhost:80/ && echo\
        \ SMOKE_OK\"]' \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --output json\
        \ | jq -r '.Command.CommandId')\nfor i in $(seq 1 30); do\n  STATUS=$(aws\
        \ ssm get-command-invocation \\\n    --command-id \"$COMMAND_ID\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query Status --output text)\n  echo \"Status: $STATUS\"\n\
        \  [ \"$STATUS\" = \"Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ]\
        \ || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ] &&\
        \ exit 1\n  sleep 10\ndone\nexit 1\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  production-approval:
    name: Production approval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    environment: production
    steps:
    - name: Await manual approval
      run: echo "Approval granted via GitHub environment protection rule."
  deploy-production:
    name: Deploy (production) via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-approval
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      id: deploy
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: "set -euo pipefail\nLOWER_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\nIMAGE=\"${{ env.REGISTRY }}/${LOWER_REPO}:${{\
        \ env.IMAGE_TAG }}\"\nSCRIPT=$(cat <<'EOF'\nset -e\nif ! command -v docker\
        \ >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install\
        \ -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker;\
        \ elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get\
        \ install -y docker.io; fi; systemctl enable --now docker; fi\necho \"$GHCR_TOKEN\"\
        \ | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin\ndocker pull $IMAGE\ndocker\
        \ rm -f app-previous || true\ndocker tag app app-previous || true\ndocker\
        \ rm -f app || true\ndocker run -d --name app --restart unless-stopped -p\
        \ 80:80 $IMAGE\ndocker ps --filter name=app\nEOF\n)\nCOMMANDS_JSON=$(jq -n\
        \ --arg c \"$SCRIPT\" '[\"set -e\",$c]')\nCOMMAND_ID=$(aws ssm send-command\
        \ \\\n  --instance-ids \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name\
        \ \"AWS-RunShellScript\" \\\n  --comment \"Deploy app container (production)\"\
        \ \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --output json | jq -r '.Command.CommandId')\necho \"COMMAND_ID=${COMMAND_ID}\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Wait for SSM command success
      run: "set -euo pipefail\nfor i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation\
        \ \\\n    --command-id \"${{ env.COMMAND_ID }}\" \\\n    --instance-id \"\
        ${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION }}\" \\\
        \n    --query Status --output text)\n  echo \"Status: $STATUS\"\n  [ \"$STATUS\"\
        \ = \"Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\"\
        \ = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ] && exit 1\n  sleep 10\n\
        done\nexit 1\n"
    - name: Health check (in-instance)
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --parameters commands='[\"curl --fail http://localhost:80/\"]' \\\n\
        \  --region \"${{ env.AWS_REGION }}\" \\\n  --output json | jq -r '.Command.CommandId')\n\
        for i in $(seq 1 30); do\n  STATUS=$(aws ssm get-command-invocation \\\n \
        \    --command-id \"$COMMAND_ID\" \\\n    --instance-id \"${{ env.EC2_INSTANCE_ID\
        \ }}\" \\\n    --region \"${{ env.AWS_REGION }}\" \\\n    --query Status --output\
        \ text)\n  echo \"Status: $STATUS\"\n  [ \"$STATUS\" = \"Success\" ] && exit\
        \ 0\n  [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] ||\
        \ [ \"$STATUS\" = \"TimedOut\" ] && exit 1\n  sleep 10\ndone\nexit 1\n"
    - name: Smoke test root endpoint
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --parameters commands='[\"curl --fail http://localhost:80/ && echo\
        \ SMOKE_OK\"]' \\\n  --region \"${{ env.AWS_REGION }}\" \\\n  --output json\
        \ | jq -r '.Command.CommandId')\nfor i in $(seq 1 30); do\n  STATUS=$(aws\
        \ ssm get-command-invocation \\\n    --command-id \"$COMMAND_ID\" \\\n   \
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n    --region \"${{ env.AWS_REGION\
        \ }}\" \\\n    --query Status --output text)\n  echo \"Status: $STATUS\"\n\
        \  [ \"$STATUS\" = \"Success\" ] && exit 0\n  [ \"$STATUS\" = \"Failed\" ]\
        \ || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\" ] &&\
        \ exit 1\n  sleep 10\ndone\nexit 1\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-production-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: failure()
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Roll back to previous image
      run: "set -euo pipefail\nLOWER_REPO=$(echo \"${{ github.repository }}\" | tr\
        \ '[:upper:]' '[:lower:]')\naws ssm send-command \\\n  --instance-ids \"${{\
        \ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\" \\\
        \n  --comment \"Rollback app container\" \\\n  --parameters commands=\"[\\\
        \"set -e\\\",\\\"docker rm -f app || true\\\",\\\"docker run -d --name app\
        \ --restart unless-stopped -p 80:80 app-previous:latest || docker run -d --name\
        \ app --restart unless-stopped -p 80:80 ghcr.io/${LOWER_REPO}:latest\\\",\\\
        \"docker ps --filter name=app\\\"]\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \ \\\n  --output json\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rollback-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn
  post-deploy:
    name: Post-deploy verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    - rollback
    if: always() && needs.deploy-production.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy verification
      run: "set -euo pipefail\nCOMMAND_ID=$(aws ssm send-command \\\n  --instance-ids\
        \ \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --document-name \"AWS-RunShellScript\"\
        \ \\\n  --parameters commands='[\"docker ps --filter name=app --format {{.Status}}\"\
        ,\"curl --fail http://localhost:80/\"]' \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --output json | jq -r '.Command.CommandId')\nfor i in $(seq 1\
        \ 30); do\n  STATUS=$(aws ssm get-command-invocation \\\n    --command-id\
        \ \"$COMMAND_ID\" \\\n    --instance-id \"${{ env.EC2_INSTANCE_ID }}\" \\\n\
        \    --region \"${{ env.AWS_REGION }}\" \\\n    --query Status --output text)\n\
        \  echo \"Status: $STATUS\"\n  [ \"$STATUS\" = \"Success\" ] && exit 0\n \
        \ [ \"$STATUS\" = \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\"\
        \ = \"TimedOut\" ] && exit 1\n  sleep 10\ndone\nexit 1\n"
      if: ${{ env.ACT != 'true' }}
    - name: Report failure context
      if: failure()
      run: 'echo "Post-deploy verification failed; SSM command output above."

        exit 1'
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: post-deploy-artifacts
        path: 'reports/**

          dist/**

          '
        if-no-files-found: warn