name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: app-slzj
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_TAG: latest
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0b8123fec53c25bc6
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  ACCESS_URL: http://54.198.44.198
  HEALTHCHECK_PATH: /
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  security:
    name: Security (secrets & code)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # - name: Scan for committed secrets (gitleaks)
    #   if: ${{ env.ACT != 'true' }}
    #   run: "docker run --rm -v \"$(pwd):/repo\" --workdir /repo \\\n  zricethezav/gitleaks:latest\
    #     \ detect --source /repo --no-git --redact -v\n"
    # - name: Initialize CodeQL
    #   if: ${{ env.ACT != 'true' }}
    #   uses: github/codeql-action/init@v3
    #   with:
    #     languages: javascript
    # - name: Perform CodeQL analysis
    #   if: ${{ env.ACT != 'true' }}
    #   uses: github/codeql-action/analyze@v3
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: security-artifacts
        path: "reports/**\ndist/**\n"
        if-no-files-found: warn
  build:
    name: Build, scan & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Normalize image repository (lowercase)
      shell: bash
      run: |
        IMAGE_REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
        echo "Using image: ghcr.io/$IMAGE_REPO:latest"

    - name: Set up Docker Buildx
      if: ${{ env.ACT != 'true' }}
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      if: ${{ env.ACT != 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image (with GHA layer cache)
      if: ${{ env.ACT != 'true' }}
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    # - name: Scan image with Trivy
    #   if: ${{ env.ACT != 'true' }}
    #   uses: aquasecurity/trivy-action@v0.36.0
    #   with:
    #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
    #     format: table
    #     exit-code: '1'
    #     severity: CRITICAL,HIGH
    - name: Smoke test container locally
      if: ${{ env.ACT != 'true' }}
      run: 'docker run -d --name smoke -p 8080:80 "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

        sleep 5

        curl --fail http://localhost:8080/ > /dev/null

        docker rm -f smoke

        '
    - name: Push image to GHCR
      if: ${{ env.ACT != 'true' }}
      run: 'docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

        docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest"

        '
    - name: Upload build metadata
      uses: actions/upload-artifact@v4
      with:
        name: image-metadata
        path: Dockerfile
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: "reports/**\ndist/**\n"
        if-no-files-found: warn
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      if: ${{ env.ACT != 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Normalize image repository (lowercase)
      shell: bash
      run: |
        IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
        echo "Using image: ghcr.io/$IMAGE_REPO:latest"
    - name: Deploy to EC2 via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER }}" \
          --arg token "${{ secrets.GHCR_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg healthcheck_path "${{ env.HEALTHCHECK_PATH }}" \
          '[
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi",
            "systemctl enable --now docker || service docker start",
            ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
            ("docker pull " + ($img | @sh)),
            "docker rm -f app-new 2>/dev/null || true",
            ("docker run -d --name app-new --restart unless-stopped -p 127.0.0.1:" + $host_port + ":" + $container_port + " " + ($img | @sh)),
            "sleep 3",
            ("docker exec app-new sh -c " + (("command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:" + $container_port + $healthcheck_path + " || command -v wget >/dev/null 2>&1 && wget -q -O /dev/null http://localhost:" + $container_port + $healthcheck_path) | @sh)),
            "docker stop app 2>/dev/null || true",
            "docker rm app 2>/dev/null || true",
            "docker stop app-new 2>/dev/null || true",
            "docker rm app-new 2>/dev/null || true",
            ("docker run -d --name app-new --restart unless-stopped " + ($img | @sh)),
          ]')

        COMMANDS_JSON=$(jq -n --argjson c "$COMMANDS_JSON" '{"commands": $c}')

        echo "Sending deployment command to SSM..."

        aws ssm send-command \
          --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query Status \
            --output text || true)

          echo "SSM status: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            exit 0
          fi

          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --output json || true
            exit 1
          fi

          sleep 10
        done

        echo "SSM command timed out"
        exit 1
    - name: Health check on public IP
      if: ${{ env.ACT != 'true' }}
      run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${{ env.ACCESS_URL }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
    - name: Smoke test homepage
      if: ${{ env.ACT != 'true' }}
      run: 'CODE=$(curl --fail -s -o /dev/null -w "%{http_code}" "${{ env.ACCESS_URL }}:${{ env.HOST_PORT }}/")

        echo "$CODE" | grep -q 200

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: "reports/**\ndist/**\n"
        if-no-files-found: warn
  production-approval:
    name: Production approval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
    steps:
    - name: Await required reviewer approval
      run: echo "Approved via GitHub environment protection rules"
  deploy-production:
    name: Deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-approval
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      if: ${{ env.ACT != 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Normalize image repository (lowercase)
      shell: bash
      run: |
        IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
        echo "Using image: ghcr.io/$IMAGE_REPO:latest"
    - name: Retag current image as previous (rollback point)
      if: ${{ env.ACT != 'true' }}
      run: 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" || true

        docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous" || true

        docker push "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous" || true

        '
    
    - name: Deploy to EC2 via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER }}" \
          --arg token "${{ secrets.GHCR_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          '[
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi",
            "systemctl enable --now docker || service docker start",
            ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
            ("docker pull " + ($img | @sh)),
            "docker rm -f app-new 2>/dev/null || true",
            ("docker run -d --name app-new --restart unless-stopped " + ($img | @sh)),
            "sleep 3",
            ("docker exec app-new sh -c " + (("command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:" + $container_port + "/ || command -v wget >/dev/null 2>&1 && wget -q -O /dev/null http://localhost:" + $container_port + "/") | @sh)),
            "docker rm -f app-new",
            "docker stop app 2>/dev/null || true",
            "docker rm app 2>/dev/null || true",
            ("docker run -d --name app --restart unless-stopped -p " + $host_port + ":" + $container_port + " " + ($img | @sh))
          ]')

        COMMANDS_JSON=$(jq -n --argjson commands "$COMMANDS_JSON" '{"commands": $commands}')

        echo "Sending deployment command to EC2 via SSM..."

        aws ssm send-command \
          --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query Status \
            --output text 2>/dev/null || true)

          echo "SSM status: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            exit 0
          fi

          if [ "$STATUS" = "Failed" ] || \
             [ "$STATUS" = "Cancelled" ] || \
             [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --output json || true
            exit 1
          fi

          sleep 10
        done

        echo "SSM command timed out"
        exit 1

    - name: Health check on public IP
      if: ${{ env.ACT != 'true' }}
      run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${{ env.ACCESS_URL }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
    - name: Smoke test homepage
      if: ${{ env.ACT != 'true' }}
      run: 'CODE=$(curl --fail -s -o /dev/null -w "%{http_code}" "${{ env.ACCESS_URL }}:${{ env.HOST_PORT }}/")

        echo "$CODE" | grep -q 200

        '
    - name: Deployment notification
      if: always()
      run: 'echo "Production deployment to ${{ env.ACCESS_URL }} finished with status: ${{ job.status }}"

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-production-artifacts
        path: "reports/**\ndist/**\n"
        if-no-files-found: warn
  rollback:
    name: Rollback (on failure)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: failure()
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Configure AWS credentials (OIDC)
      if: ${{ env.ACT != 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Roll back to previous image via SSM
      if: ${{ env.ACT != 'true' }}
      run: "set -e\nIMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:previous\"\n\
        COMMANDS_JSON=$(jq -n \\\n  --arg img \"$IMAGE\" \\\n  --arg user \"${{ secrets.GHCR_USER\
        \ }}\" \\\n  --arg token \"${{ secrets.GHCR_TOKEN }}\" \\\n  --arg host_port\
        \ \"${{ env.HOST_PORT }}\" \\\n  --arg container_port \"${{ env.CONTAINER_PORT\
        \ }}\" \\\n  '[\"set -e\",\n    \"if ! command -v docker >/dev/null 2>&1;\
        \ then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif\
        \ command -v yum >/dev/null 2>&1; then yum install -y docker; elif command\
        \ -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io;\
        \ fi; systemctl enable --now docker || service docker start; fi\",\n    (\"\
        echo \" + ($token | @sh) + \" | docker login ghcr.io -u \" + ($user | @sh)\
        \ + \" --password-stdin\"),\n    (\"docker pull \" + $img),\n    \"docker\
        \ stop app || true\",\n    \"docker rm app || true\",\n    (\"docker run -d\
        \ --name app --restart unless-stopped -p \" + $host_port + \":\" + $container_port\
        \ + \" \" + $img)\n  ] | map(@sh) | join(\" \")')\nCOMMANDS_JSON=$(jq -n --arg\
        \ c \"$COMMANDS_JSON\" '{\"commands\": [$c]}')\naws ssm send-command \\\n\
        \  --instance-ids \"${{ env.EC2_INSTANCE_ID }}\" \\\n  --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  --document-name \"AWS-RunShellScript\" \\\n  --comment \"Rollback\
        \ app\" \\\n  --parameters \"$COMMANDS_JSON\" \\\n  --output json > ssm-output.json\n\
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)\nfor i in $(seq 1\
        \ 30); do\n  STATUS=$(aws ssm get-command-invocation --command-id \"$COMMAND_ID\"\
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION\
        \ }}\" --query Status --output text || true)\n  echo \"SSM status: $STATUS\"\n\
        \  if [ \"$STATUS\" = \"Success\" ]; then exit 0; fi\n  if [ \"$STATUS\" =\
        \ \"Failed\" ] || [ \"$STATUS\" = \"Cancelled\" ] || [ \"$STATUS\" = \"TimedOut\"\
        \ ]; then\n    aws ssm get-command-invocation --command-id \"$COMMAND_ID\"\
        \ --instance-id \"${{ env.EC2_INSTANCE_ID }}\" --region \"${{ env.AWS_REGION\
        \ }}\" --output json || true\n    exit 1\n  fi\n  sleep 10\ndone\nexit 1\n"
    - name: Rollback notification
      if: always()
      run: 'echo "Rollback to previous image finished with status: ${{ job.status }} (target: ${{ env.ACCESS_URL }})"

        '
  post-deploy:
    name: Post-deploy verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Post-deploy verification
      if: ${{ env.ACT != 'true' }}
      run: curl --fail -s "${{ env.ACCESS_URL }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" && echo "Deployment verified"
